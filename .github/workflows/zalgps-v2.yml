name: ZalGPS V2 CI
on:
  push:
    paths: ['v2/**', '.github/workflows/zalgps-v2.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/zalgps-v2.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: zalgps_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci -d zalgps_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - name: Test
        env:
          ZALGPS_TEST_DATABASE_URL: postgres://ci:ci-only-disposable@127.0.0.1:${{ job.services.postgres.ports[5432] }}/zalgps_ci?sslmode=disable
        run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/zalgpsd
