name: ZalGPS V2 CI
on:
  push:
    paths: ['v2/**', '.github/workflows/zalgps-v2.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/zalgps-v2.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07 # PostgreSQL 16.9 / PostGIS 3.5.2, verified image
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: zalgps_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci -d zalgps_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - name: Bootstrap PostGIS and disposable database roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: ci
          PGPASSWORD: ci-only-disposable
          PGDATABASE: zalgps_ci
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d template1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          version=$(psql -X -At -v ON_ERROR_STOP=1 -d template1 -c "SELECT extversion FROM pg_extension WHERE extname = 'postgis' AND extversion ~ '^[0-9]+\\.[0-9]+\\.[0-9]+(\\+[A-Za-z0-9.-]+)?$' AND string_to_array(split_part(extversion, '+', 1), '.')::int[] >= ARRAY[3,5,2] AND string_to_array(split_part(extversion, '+', 1), '.')::int[] < ARRAY[4,0,0];")
          test -n "$version"
          psql -X -v ON_ERROR_STOP=1 -d zalgps_ci -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          version=$(psql -X -At -v ON_ERROR_STOP=1 -d zalgps_ci -c "SELECT extversion FROM pg_extension WHERE extname = 'postgis' AND extversion ~ '^[0-9]+\\.[0-9]+\\.[0-9]+(\\+[A-Za-z0-9.-]+)?$' AND string_to_array(split_part(extversion, '+', 1), '.')::int[] >= ARRAY[3,5,2] AND string_to_array(split_part(extversion, '+', 1), '.')::int[] < ARRAY[4,0,0];")
          test -n "$version"
          for role in MIGRATOR PROVISIONER RUNTIME; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "ZALGPS_${role}_DATABASE_URL=postgres://zalgps_${role,,}:$value@127.0.0.1:$PGPORT/zalgps_ci?sslmode=disable" >> "$GITHUB_ENV"
            export "${role}_PASSWORD=$value"
          done
          echo "ZALGPS_TEST_DATABASE_URL=postgres://zalgps_migrator:$MIGRATOR_PASSWORD@127.0.0.1:$PGPORT/zalgps_ci?sslmode=disable" >> "$GITHUB_ENV"
          psql -X -v ON_ERROR_STOP=1 -v migrator="$MIGRATOR_PASSWORD" -v provisioner="$PROVISIONER_PASSWORD" -v runtime="$RUNTIME_PASSWORD" <<'SQL'
          CREATE ROLE zalgps_functions NOLOGIN;
          CREATE ROLE zalgps_migrator LOGIN CREATEDB PASSWORD :'migrator';
          CREATE ROLE zalgps_provisioner LOGIN PASSWORD :'provisioner';
          CREATE ROLE zalgps_runtime LOGIN PASSWORD :'runtime';
          GRANT zalgps_functions TO zalgps_migrator;
          CREATE ROLE zalgps_test_schema_create NOLOGIN;
          GRANT zalgps_test_schema_create TO zalgps_runtime;
          ALTER DATABASE zalgps_ci OWNER TO zalgps_migrator;
          SQL
      - name: Test
        env:
          ZALGPS_REQUIRE_ROLE_TESTS: '1'
        run: go test -race -count=1 -v ./...
      - run: go vet ./...
      - run: go build ./cmd/zalgpsd
